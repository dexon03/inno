spring.application.name=inno

# Порт можна перевизначити: у 8080 часто вже щось слухає.
server.port=${SERVER_PORT:8080}

# Назви саме spring.mongodb.*, як в оригіналі. У Spring Boot 4 це канонічний простір імен для
# налаштувань драйвера, а звичніші spring.data.mongodb.host/port/database позначені застарілими
# і перенаправляють сюди ж. Перевірено за spring-configuration-metadata.json у
# spring-boot-mongodb-4.1.1.jar.
spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DB:inno}

# А оцей ключ лишається під spring.data.mongodb: створення індексів -- справа Spring Data,
# а не драйвера. Потрібен, щоб спрацював @Indexed(unique = true) на коді запису.
spring.data.mongodb.auto-index-creation=true

springdoc.swagger-ui.path=/swagger-ui.html

# Стектрейси назовні не віддаються: подробиці йдуть у лог.
server.error.include-stacktrace=never
server.error.include-message=never

# --- Аудит змін (Javers) ---
# Префікс саме javers.mongodb.*, як каже spring-configuration-metadata.json у стартері.
# У взірці лекції стояло spring.javers.mobgodb.host, тобто і зайвий префікс spring,
# і друкарська помилка в слові mongodb. Spring такі ключі мовчки ігнорує, тож історія
# змін лягала не в окрему базу, а поряд із самими записами.
javers.mongodb.host=${MONGO_HOST:localhost}
javers.mongodb.port=${MONGO_PORT:27017}
javers.mongodb.database=${MONGO_AUDIT_DB:inno-audit}

# Зберігати знімок і для щойно створеного запису: інакше в історії видно зміни,
# але не видно, з чого запис починався.
javers.new-object-snapshot=true
